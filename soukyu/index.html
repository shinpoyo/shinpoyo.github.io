<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>蒼穹斬 — 古竜討伐アクション</title>
<meta name="description" content="白銀の騎士となって、溶岩の古竜ファフニールに挑むブラウザ用アクションゲーム。連撃・回避・最終奥義「蒼穹斬」で討伐し、クリアタイムとランクを競います。スマホ・PC対応、無料・登録不要。">
<meta property="og:title" content="蒼穹斬 — 古竜討伐アクション">
<meta property="og:description" content="白銀の騎士となって、溶岩の古竜ファフニールに挑むアクションゲーム。スマホ・PCで無料で遊べます。">
<meta property="og:type" content="website">
<meta property="og:url" content="https://shinpoyo.com/soukyu/">

<style>
html,body{margin:0;height:100%;background:#05060a;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}

<body>
<canvas id="c" tabindex="0" aria-label="蒼穹斬（ゲーム画面）"></canvas>
<noscript>このゲームを遊ぶには JavaScript を有効にしてください。</noscript>
<script>
(() => {
'use strict';
// ================= 基本設定 =================
const W = 1280, H = 720;          // 論理解像度
const P = 0.55;                   // 奥行きの縮み（地面の y → 画面 y）
const HOR = 300;                  // 地面 g=0 の画面上の位置（その上は空）
const WW = 2200, WG = 1500;       // ワールドの幅・奥行き
const BGH = Math.ceil(HOR + WG * P);
const AR = { x0: 150, x1: 2050, g0: 320, g1: 1420 }; // 戦える範囲
const TAU = Math.PI * 2;
const FONT_M = '"Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif JP","MS PMincho",serif';
const FONT_S = '"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic UI","Meiryo","Noto Sans JP",sans-serif';

const cv = document.getElementById('c');
const cx = cv.getContext('2d');
let SC = 1, K = 1;
function resize() {
  SC = Math.min(innerWidth / W, innerHeight / H);
  const dpr = window.devicePixelRatio || 1;
  K = Math.min(SC * dpr, 2200 / W);          // 描画倍率（重くなりすぎないよう上限）
  cv.style.width = (W * SC) + 'px';
  cv.style.height = (H * SC) + 'px';
  cv.width = Math.round(W * K);
  cv.height = Math.round(H * K);
}
addEventListener('resize', resize);
resize();

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const easeOut = u => 1 - Math.pow(1 - u, 3);
const easeIn = u => u * u * u;
function angDiff(a, b) { let d = (a - b) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; }
function mulberry(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const isTouch = matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window;
function fmtTime(s) { const m = Math.floor(s / 60), r = s - m * 60; return String(m).padStart(2, '0') + ':' + r.toFixed(2).padStart(5, '0'); }

// ================= 保存 =================
const SAVE_KEY = 'soukyu-save-v1';
let save = { best: {}, mute: false };
try { const s = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); if (s) save = Object.assign(save, s); } catch (e) {}
function writeSave() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {} }

// ================= 音 =================
const AU = {
  c: null, m: null, nb: null, muted: !!save.mute, fire: null, bgmOn: false, timer: null,
  init() {
    if (this.c) { if (this.c.state === 'suspended') this.c.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    try {
      this.c = new AC();
      this.m = this.c.createGain(); this.m.gain.value = this.muted ? 0 : 0.55; this.m.connect(this.c.destination);
      const len = this.c.sampleRate; const b = this.c.createBuffer(1, len, this.c.sampleRate); const d = b.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      this.nb = b;
    } catch (e) { this.c = null; }
  },
  setMute(v) { this.muted = v; save.mute = v; writeSave(); if (this.m) this.m.gain.value = v ? 0 : 0.55; },
  tone(f, d, type = 'sine', v = .2, f2 = 0, when = 0) {
    if (!this.c) return; const t = this.c.currentTime + Math.max(0, when);
    const o = this.c.createOscillator(), g = this.c.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(v, t + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g); g.connect(this.m); o.start(t); o.stop(t + d + 0.03);
  },
  noise(d, v = .2, ft = 'bandpass', f = 1000, f2 = 0, q = 1, when = 0) {
    if (!this.c) return; const t = this.c.currentTime + Math.max(0, when);
    const s = this.c.createBufferSource(); s.buffer = this.nb; s.loop = true;
    const fl = this.c.createBiquadFilter(); fl.type = ft; fl.frequency.setValueAtTime(f, t); if (f2) fl.frequency.exponentialRampToValueAtTime(f2, t + d); fl.Q.value = q;
    const g = this.c.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(v, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    s.connect(fl); fl.connect(g); g.connect(this.m); s.start(t, Math.random() * 0.5); s.stop(t + d + 0.03);
  },
  slash(p = 1) { this.noise(.14, .22, 'bandpass', 3200 * p, 900, 1.2); this.tone(700 * p, .1, 'triangle', .05, 250); },
  hit(crit) { this.tone(crit ? 150 : 120, .18, 'sine', .35, 40); this.noise(.1, .25, 'lowpass', 2500, 300, .7); if (crit) this.tone(1800, .12, 'square', .05, 900); },
  dodge() { this.noise(.22, .12, 'bandpass', 600, 2600, 1.5); },
  perfect() { this.tone(1320, .35, 'sine', .14); this.tone(1980, .45, 'sine', .1, 0, .06); this.noise(.3, .08, 'highpass', 5000, 0, .7); },
  hurt() { this.tone(260, .2, 'square', .08, 110); this.noise(.15, .2, 'lowpass', 1200, 200); },
  roar() { this.tone(150, 1.3, 'sawtooth', .16, 55); this.tone(110, 1.3, 'sawtooth', .12, 45); this.noise(1.3, .22, 'lowpass', 900, 150, .8); },
  stomp() { this.tone(70, .6, 'sine', .5, 25); this.noise(.5, .3, 'lowpass', 600, 80, .6); },
  claw() { this.noise(.25, .25, 'bandpass', 1500, 400, 1); this.tone(200, .25, 'sawtooth', .06, 80); },
  boom() { this.tone(90, .5, 'sine', .4, 30); this.noise(.45, .25, 'lowpass', 1800, 120, .6); },
  potion() { [660, 880, 1100].forEach((f, i) => this.tone(f, .2, 'sine', .1, 0, i * .07)); },
  skill() { this.noise(.6, .18, 'bandpass', 800, 3000, 2); this.tone(400, .5, 'triangle', .06, 1200); },
  ultCharge() { this.tone(180, 1.1, 'sawtooth', .07, 1400); this.noise(1.1, .12, 'bandpass', 400, 6000, 3); },
  ultSlash() { this.noise(.7, .35, 'bandpass', 5000, 300, .8); this.tone(1600, .6, 'triangle', .12, 120); this.tone(60, .9, 'sine', .45, 25, .05); },
  click() { this.tone(900, .07, 'triangle', .08, 600); },
  win() { const n = [523, 659, 784, 1046, 784, 1046, 1318]; n.forEach((f, i) => { this.tone(f, .4, 'triangle', .12, 0, i * .12); this.tone(f / 2, .4, 'sine', .08, 0, i * .12); }); },
  lose() { [392, 330, 262, 196].forEach((f, i) => this.tone(f, .6, 'triangle', .1, 0, i * .25)); },
  fireStart() {
    if (!this.c || this.fire) return; const t = this.c.currentTime;
    const s = this.c.createBufferSource(); s.buffer = this.nb; s.loop = true;
    const fl = this.c.createBiquadFilter(); fl.type = 'lowpass'; fl.frequency.value = 900;
    const g = this.c.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(.3, t + .2);
    s.connect(fl); fl.connect(g); g.connect(this.m); s.start(); this.fire = { s, g };
  },
  fireStop() {
    if (!this.fire || !this.c) { this.fire = null; return; } const t = this.c.currentTime; const f = this.fire; this.fire = null;
    f.g.gain.cancelScheduledValues(t); f.g.gain.setValueAtTime(f.g.gain.value, t); f.g.gain.linearRampToValueAtTime(0.0001, t + .25); f.s.stop(t + .3);
  },
  bgmStart() {
    if (!this.c || this.bgmOn) return; this.bgmOn = true; this.nt = this.c.currentTime + .1; this.st = 0;
    this.timer = setInterval(() => this.sched(), 50);
  },
  bgmStop() { this.bgmOn = false; clearInterval(this.timer); this.timer = null; },
  sched() {
    if (!this.c) return; const spb = 60 / 148 / 2; // 8分音符
    const bass = [45, 45, 57, 45, 48, 45, 52, 50, 45, 45, 57, 45, 53, 52, 50, 48];
    const mf = n => 440 * Math.pow(2, (n - 69) / 12);
    while (this.nt < this.c.currentTime + .3) {
      const s = this.st % 32, w = this.nt - this.c.currentTime;
      const bn = bass[s % 16] - (s >= 16 && s % 16 >= 8 ? 2 : 0);
      this.tone(mf(bn - 12), spb * .9, 'sawtooth', .045, 0, w);
      this.tone(mf(bn), spb * .6, 'triangle', .03, 0, w);
      if (s % 4 === 0) this.tone(110, .2, 'sine', .22, 38, w);
      if (s % 8 === 4) this.noise(.14, .1, 'highpass', 1800, 0, .8, w);
      if (s % 2 === 1) this.noise(.03, .035, 'highpass', 7000, 0, .8, w);
      if (s % 16 === 0) { const ch = s < 16 ? [57, 60, 64] : [55, 59, 62]; ch.forEach(n => this.tone(mf(n), spb * 15, 'triangle', .022, 0, w)); }
      this.nt += spb; this.st++;
    }
  }
};

// ================= 入力 =================
const keys = {};
const press = {}; // そのフレームだけ true
const buf = {};   // 先行入力（少しのあいだ覚えておく）
function take(k) { if (buf[k] > 0) { buf[k] = 0; return true; } return false; }
function peek(k) { return buf[k] > 0; }
const held = { attack: false };
const KEYMAP = {
  KeyJ: 'attack', KeyZ: 'attack', KeyK: 'dodge', KeyX: 'dodge', Space: 'dodge', ShiftLeft: 'dodge', ShiftRight: 'dodge',
  KeyL: 'skill', KeyC: 'skill', KeyU: 'ult', KeyV: 'ult', KeyI: 'ult', KeyH: 'potion', KeyQ: 'potion', Escape: 'pause', KeyP: 'pause'
};
addEventListener('keydown', e => {
  AU.init();
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
  if (e.repeat) return;
  keys[e.code] = true;
  const a = KEYMAP[e.code]; if (a) press[a] = true;
  if (a === 'attack') held.attackKey = true;
  if (e.code === 'Enter' || e.code === 'NumpadEnter') press.enter = true;
  if (e.code === 'KeyM') AU.setMute(!AU.muted);
});
addEventListener('keyup', e => { keys[e.code] = false; if (KEYMAP[e.code] === 'attack') held.attackKey = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; held.attackKey = false; held.attack = false; joy.id = null; if (state === 'battle') pauseGame(); });
document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'battle') pauseGame(); });

const joy = { id: null, ox: 0, oy: 0, x: 0, y: 0, vx: 0, vy: 0 };
const ptrs = {}; // pointerId -> 'joy' | 'attack' | ...
function toCanvas(e) { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H }; }
cv.addEventListener('contextmenu', e => e.preventDefault());
cv.addEventListener('pointerdown', e => {
  AU.init(); e.preventDefault(); cv.focus();
  try { cv.setPointerCapture(e.pointerId); } catch (er) {}
  const p = toCanvas(e);
  if (state !== 'battle') { clickUI(p); return; }
  if (inCircle(p, HUDBTN.pause)) { AU.click(); pauseGame(); return; }
  if (inCircle(p, HUDBTN.mute)) { AU.setMute(!AU.muted); return; }
  for (const k in BTN) {
    const b = BTN[k];
    if (Math.hypot(p.x - b.x, p.y - b.y) < b.r * 1.18) {
      press[k] = true; if (k === 'attack') held.attack = true; ptrs[e.pointerId] = k; return;
    }
  }
  if (e.pointerType === 'mouse') {
    if (e.button === 2) press.dodge = true; else { press.attack = true; held.attack = true; ptrs[e.pointerId] = 'attack'; }
    return;
  }
  if (p.x < W * 0.55 && joy.id === null) {
    joy.id = e.pointerId; joy.ox = p.x; joy.oy = p.y; joy.x = p.x; joy.y = p.y; joy.vx = joy.vy = 0; ptrs[e.pointerId] = 'joy';
  } else { press.attack = true; held.attack = true; ptrs[e.pointerId] = 'attack'; }
});
cv.addEventListener('pointermove', e => {
  if (e.pointerId !== joy.id) return;
  const p = toCanvas(e); let dx = p.x - joy.ox, dy = p.y - joy.oy; const d = Math.hypot(dx, dy), R = 70;
  if (d > R) { joy.ox += dx * (1 - R / d) * 0.5; joy.oy += dy * (1 - R / d) * 0.5; dx = p.x - joy.ox; dy = p.y - joy.oy; }
  const d2 = Math.hypot(dx, dy); const m = Math.min(1, d2 / R);
  joy.x = p.x; joy.y = p.y; joy.vx = d2 > 6 ? dx / d2 * m : 0; joy.vy = d2 > 6 ? dy / d2 * m : 0;
});
function ptrEnd(e) {
  const k = ptrs[e.pointerId]; delete ptrs[e.pointerId];
  if (e.pointerId === joy.id) { joy.id = null; joy.vx = joy.vy = 0; }
  if (k === 'attack') { held.attack = Object.values(ptrs).includes('attack'); }
}
cv.addEventListener('pointerup', ptrEnd);
cv.addEventListener('pointercancel', ptrEnd);
function inCircle(p, b) { return Math.hypot(p.x - b.x, p.y - b.y) < b.r; }
function moveInput() {
  let mx = 0, my = 0;
  if (keys.KeyA || keys.ArrowLeft) mx -= 1; if (keys.KeyD || keys.ArrowRight) mx += 1;
  if (keys.KeyW || keys.ArrowUp) my -= 1; if (keys.KeyS || keys.ArrowDown) my += 1;
  if (mx || my) { const d = Math.hypot(mx, my); return { x: mx / d, y: my / d }; }
  if (joy.id !== null) return { x: joy.vx, y: joy.vy };
  return { x: 0, y: 0 };
}

// ================= 背景の下ごしらえ =================
const bg = document.createElement('canvas'); bg.width = WW; bg.height = BGH;
const glowL = document.createElement('canvas'); glowL.width = WW; glowL.height = BGH;
const vig = document.createElement('canvas'); vig.width = W; vig.height = H;
function gy(g) { return HOR + g * P; }
function buildBG() {
  const c = bg.getContext('2d'), gc = glowL.getContext('2d'), r = mulberry(20261106);
  // 空
  let gr = c.createLinearGradient(0, 0, 0, HOR + 60);
  gr.addColorStop(0, '#07090f'); gr.addColorStop(.55, '#151a26'); gr.addColorStop(1, '#2a2730');
  c.fillStyle = gr; c.fillRect(0, 0, WW, HOR + 80);
  // 雲
  for (let i = 0; i < 160; i++) {
    const x = r() * WW, y = r() * (HOR - 40), rr = 40 + r() * 140;
    const g2 = c.createRadialGradient(x, y, 0, x, y, rr);
    const a = 0.05 + r() * 0.07;
    g2.addColorStop(0, `rgba(120,125,145,${a})`); g2.addColorStop(1, 'rgba(120,125,145,0)');
    c.fillStyle = g2; c.beginPath(); c.arc(x, y, rr, 0, TAU); c.fill();
  }
  // 遠くの山（溶岩の明かり）
  c.fillStyle = '#0d0e14'; c.beginPath(); c.moveTo(0, HOR);
  for (let x = 0; x <= WW; x += 40) c.lineTo(x, HOR - 60 - Math.sin(x * .004) * 40 - Math.sin(x * .011 + 1) * 25 - r() * 12);
  c.lineTo(WW, HOR); c.closePath(); c.fill();
  for (let i = 0; i < 6; i++) {
    const x = 200 + r() * (WW - 400), y = HOR - 40;
    const g3 = c.createRadialGradient(x, y, 0, x, y, 160);
    g3.addColorStop(0, 'rgba(255,90,30,.22)'); g3.addColorStop(1, 'rgba(255,90,30,0)');
    c.fillStyle = g3; c.fillRect(x - 160, y - 160, 320, 320);
  }
  // 遠景の廃墟（アーチ）
  c.fillStyle = '#121219';
  for (let x = 40; x < WW; x += 300 + r() * 120) {
    const h = 90 + r() * 60, w = 120 + r() * 80, y = HOR - 10;
    c.fillRect(x, y - h, 18, h); c.fillRect(x + w - 18, y - h, 18, h);
    c.beginPath(); c.moveTo(x, y - h); c.quadraticCurveTo(x + w / 2, y - h - 50, x + w, y - h); c.lineTo(x + w, y - h + 14); c.quadraticCurveTo(x + w / 2, y - h - 30, x, y - h + 14); c.fill();
  }
  // 地面
  gr = c.createLinearGradient(0, HOR, 0, BGH);
  gr.addColorStop(0, '#26262c'); gr.addColorStop(.4, '#2c2b31'); gr.addColorStop(1, '#1d1c22');
  c.fillStyle = gr; c.fillRect(0, HOR, WW, BGH - HOR);
  // 石畳
  const TG = 100, TX = 150;
  for (let g = 0; g < WG; g += TG) {
    const row = g / TG; const off = (row % 2) * TX / 2;
    for (let x = -TX; x < WW + TX; x += TX) {
      const y0 = gy(g), y1 = gy(g + TG), x0 = x + off;
      const v = 38 + r() * 16 | 0, depth = 1 - g / WG * .35;
      c.fillStyle = `rgb(${v * depth | 0},${(v - 1) * depth | 0},${(v + 5) * depth | 0})`;
      c.fillRect(x0 + 2, y0 + 2, TX - 4, y1 - y0 - 3);
      if (r() < .5) { c.fillStyle = 'rgba(255,255,255,.035)'; c.fillRect(x0 + 4, y0 + 3, TX - 8, 4); }
      if (r() < .25) { // ひび
        c.strokeStyle = 'rgba(0,0,0,.45)'; c.lineWidth = 1.2; c.beginPath();
        let px = x0 + r() * TX, py = y0 + r() * (y1 - y0); c.moveTo(px, py);
        for (let k = 0; k < 4; k++) { px += (r() - .5) * 50; py += (r() - .5) * 18; c.lineTo(px, py); } c.stroke();
      }
    }
    c.fillStyle = 'rgba(0,0,0,.35)'; c.fillRect(0, gy(g), WW, 2);
  }
  // がれき
  for (let i = 0; i < 90; i++) {
    const x = r() * WW, g = r() * WG, y = gy(g), s = 4 + r() * 12;
    c.fillStyle = 'rgba(0,0,0,.4)'; c.beginPath(); c.ellipse(x + 2, y + s * .4, s, s * .4, 0, 0, TAU); c.fill();
    c.fillStyle = `rgb(${55 + r() * 20 | 0},${52 + r() * 18 | 0},${58 + r() * 20 | 0})`;
    c.beginPath(); c.ellipse(x, y, s, s * .6, r(), 0, TAU); c.fill();
  }
  // 溶岩のひび（暗い溝＋光るレイヤー）
  for (let i = 0; i < 16; i++) {
    let x = 450 + r() * 1300, g = 380 + r() * 950; const pts = [[x, g]];
    let a = r() * TAU; const n = 6 + r() * 10 | 0;
    for (let k = 0; k < n; k++) { a += (r() - .5) * 1.2; x += Math.cos(a) * 34; g += Math.sin(a) * 34; pts.push([x, g]); }
    const wdt = .8 + r() * 1.6;
    c.strokeStyle = '#0c0605'; c.lineWidth = wdt + 3; c.lineJoin = 'round'; c.lineCap = 'round';
    c.beginPath(); pts.forEach((p, k) => k ? c.lineTo(p[0], gy(p[1])) : c.moveTo(p[0], gy(p[1]))); c.stroke();
    gc.lineJoin = 'round'; gc.lineCap = 'round';
    gc.strokeStyle = 'rgba(255,80,20,.10)'; gc.lineWidth = wdt + 9; gc.beginPath(); pts.forEach((p, k) => k ? gc.lineTo(p[0], gy(p[1])) : gc.moveTo(p[0], gy(p[1]))); gc.stroke();
    gc.strokeStyle = 'rgba(255,120,40,.6)'; gc.lineWidth = wdt; gc.beginPath(); pts.forEach((p, k) => k ? gc.lineTo(p[0], gy(p[1])) : gc.moveTo(p[0], gy(p[1]))); gc.stroke();
  }
  // 奥の列柱
  for (let x = 60; x < WW; x += 230 + r() * 60) {
    const g = 230 + r() * 50, by = gy(g), w = 44 + r() * 10; const broken = r() < .4; const h = broken ? 120 + r() * 120 : 300 + r() * 60;
    c.fillStyle = 'rgba(0,0,0,.45)'; c.beginPath(); c.ellipse(x + w / 2 + 10, by, w * .9, 12, 0, 0, TAU); c.fill();
    const pg = c.createLinearGradient(x, 0, x + w, 0);
    pg.addColorStop(0, '#2c2c34'); pg.addColorStop(.35, '#4a4a54'); pg.addColorStop(1, '#1b1b21');

  const rows = [['クリアタイム', fmtTime(r.time) + (r.newRec ? '' : '')], ['最大コンボ数', String(r.combo)], ['獲得経験値', r.exp.toLocaleString('en-US') + ' EXP'], ['獲得ゴールド', r.gold.toLocaleString('en-US') + ' G'], ['回避成功', r.perfects + ' 回']];
  rows.forEach((row, i) => {
    const a = clamp((t - .6 - i * .28) / .25, 0, 1); if (a <= 0) return;
    const y = py + 140 + i * 50;
    c.save(); c.globalAlpha = pin * a;
    c.fillStyle = 'rgba(255,255,255,.04)'; c.fillRect(px + 50, y - 20, pw - 110, 40);
    c.font = `bold 20px ${FONT_M}`; c.textAlign = 'left'; outlineText(c, row[0], px + 70, y, '#efe4cc', 'rgba(0,0,0,.8)', 3);
    c.font = `bold 24px ${FONT_S}`; c.textAlign = 'right'; outlineText(c, row[1], px + pw - 80, y, '#ffffff', 'rgba(0,0,0,.8)', 3);
    if (i === 0 && r.newRec) { c.font = `bold 13px ${FONT_S}`; c.fillStyle = '#ff7a5a'; c.textAlign = 'right'; c.fillText('ベスト更新！', px + pw - 80, y - 22); }
    c.restore();
  });
  // ランク
  const ra = clamp((t - 2.2) / .35, 0, 1);
  if (ra > 0) {
    if (!r.stamped) { r.stamped = true; AU.boom(); for (let i = 0; i < 60; i++) { const a = rand(0, TAU); r.conf = r.conf || []; r.conf.push({ x: px + 470, y: py + 440, vx: Math.cos(a) * rand(100, 420), vy: Math.sin(a) * rand(100, 420) - 120, t: 0 }); } }
    const y = py + 440, x = px + 470, sc = 1 + (1 - easeOut(ra)) * 1.6;
    c.save(); c.globalAlpha = pin * ra;
    c.font = `bold 26px ${FONT_M}`; c.textAlign = 'right'; outlineText(c, 'ランク', x - 80, y + 4, '#f4e6c8', 'rgba(0,0,0,.8)', 3);
    c.translate(x, y); c.scale(sc, sc);
    // 盾と月桂樹
    const RC = { S: ['#fff3c4', '#e9b84a', '#8a5a12'], A: ['#ffe9e0', '#e5786a', '#7a2a20'], B: ['#e4f2ff', '#6fa6e0', '#1f4a80'], C: ['#eeeeee', '#a8a8a8', '#505050'] }[r.rank];
    c.strokeStyle = RC[1]; c.lineWidth = 4;
    for (const sd of [-1, 1]) for (let i = 0; i < 6; i++) { const a = Math.PI / 2 + sd * (.5 + i * .32); const lx = Math.cos(a) * 66, ly = Math.sin(a) * 60 + 6; c.fillStyle = RC[1]; c.beginPath(); c.ellipse(lx, ly, 12, 5, a + sd * 1.1, 0, TAU); c.fill(); }
    const sg = c.createLinearGradient(0, -60, 0, 60); sg.addColorStop(0, RC[0]); sg.addColorStop(.5, RC[1]); sg.addColorStop(1, RC[2]);
    c.fillStyle = sg; c.beginPath(); c.moveTo(-48, -50); c.lineTo(48, -50); c.lineTo(46, 10); c.quadraticCurveTo(30, 46, 0, 62); c.quadraticCurveTo(-30, 46, -46, 10); c.closePath(); c.fill();
    c.strokeStyle = '#3a2200'; c.lineWidth = 3; c.stroke();
    c.font = `900 78px ${FONT_M}`; c.textAlign = 'center'; c.textBaseline = 'middle'; outlineText(c, r.rank, 0, 4, '#fffaf0', 'rgba(60,30,0,.9)', 6);
    c.restore();
  }
  c.restore();
  if (r.conf) { c.save(); c.globalCompositeOperation = 'lighter'; for (const q of r.conf) { q.t += 1 / 60; q.x += q.vx / 60; q.y += q.vy / 60; q.vy += 300 / 60; const a = Math.max(0, 1 - q.t / 1.6); c.fillStyle = `rgba(255,210,110,${a})`; c.fillRect(q.x, q.y, 4, 7); } c.restore(); }
  if (t > 1.5) {
    uiBtn(c, px + 60, 662, 260, 46, 'もう一度戦う', () => startBattle(diff), { primary: true, size: 20 });
    uiBtn(c, px + 340, 662, 220, 46, 'タイトルへ', toTitle, { size: 20 });
  }
  c.font = `12px ${FONT_S}`; c.textAlign = 'left'; outlineText(c, `難易度：${DIFF[diff].name}　受けたダメージ：${r.taken.toLocaleString('en-US')}`, 40, 76, 'rgba(230,220,200,.75)', 'rgba(0,0,0,.7)', 2);
}
function drawGameOver() {
  const c = cx; c.fillStyle = `rgba(10,0,0,${Math.min(.75, overT)})`; c.fillRect(0, 0, W, H);
  c.font = `900 72px ${FONT_M}`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.shadowColor = '#ff3a2a'; c.shadowBlur = 24; outlineText(c, '敗北……', W / 2, 220, '#ffb0a0', 'rgba(30,0,0,.9)', 7); c.shadowBlur = 0;
  c.font = `bold 20px ${FONT_M}`; outlineText(c, `古竜の残り体力 ${Math.round(boss.hp / boss.max * 100)}%　経過 ${fmtTime(battleT)}`, W / 2, 300, '#f0d8d0', 'rgba(0,0,0,.8)', 3);
  c.font = `bold 15px ${FONT_S}`; outlineText(c, 'ヒント：赤い印が満ちる瞬間に回避すると「回避成功」。ブレスは竜の横か後ろへ回りこもう', W / 2, 340, 'rgba(255,230,210,.85)', 'rgba(0,0,0,.8)', 3);
  if (overT > .8) {
    uiBtn(c, W / 2 - 280, 400, 260, 56, 'もう一度挑む', () => startBattle(diff), { primary: true });
    uiBtn(c, W / 2 + 20, 400, 260, 56, 'タイトルへ', toTitle);
  }
}

function render() {
  cx.setTransform(K, 0, 0, K, 0, 0);
  uiButtons = [];
  if (state === 'title') { drawTitle(); return; }
  if (state === 'result') { drawResult(); return; }
  drawWorld();
  if (ult.active) drawUltOverlay();
  cx.drawImage(vig, 0, 0);
  drawFlash();
  if (state !== 'victory') drawHUD();
  drawBanners();
  if (state === 'victory') {
    const a = clamp((vicT - .6) / .4, 0, 1);
    if (a > 0) {
      const c = cx; c.save(); c.globalAlpha = a;
      const g = c.createLinearGradient(0, 220, 0, 380); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(.5, 'rgba(30,15,0,.55)'); g.addColorStop(1, 'rgba(0,0,0,0)'); c.fillStyle = g; c.fillRect(0, 220, W, 160);
      const sc = 1 + (1 - easeOut(a)) * .8; c.translate(W / 2, 300); c.scale(sc, sc); goldTitle(c, '勝利', 0, 0, 110);
      c.restore();
      if (Math.random() < .7) addP({ x: cam.x + rand(200, W - 200), g: boss.g + rand(-200, 300), z: rand(100, 500), vz: rand(-40, 40), vx: rand(-60, 60), life: rand(.8, 1.4), size: rand(2, 4), col: '255,210,110', type: 'glow' });
    }
  }
  if (state === 'paused') drawPause();
  if (state === 'gameover') drawGameOver();
}

let last = performance.now();
function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min((now - last) / 1000, 1 / 20); last = now;
  try { update(dt); render(); } catch (e) { console.error(e); }
}
requestAnimationFrame(loop);
// テスト用の窓口
window.__soukyu = { get state() { return state; }, pl, boss, press, held, keys, startBattle, get combo() { return combo; }, get battleT() { return battleT; }, ult };
})();
</script>
