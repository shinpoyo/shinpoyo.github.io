<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>shinpoyo</title>
<meta name="description" content="shinpoyo が作ったゲームやアプリの置き場です。">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><circle cx='32' cy='32' r='30' fill='%23facc15'/><text x='32' y='44' font-size='34' text-anchor='middle' font-family='sans-serif' font-weight='900' fill='%23111'>s</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+1p:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0b0c; --panel: #17171a; --line: #2a2a2f; --text: #f4f4f5;
    --muted: #a1a1aa; --accent: #facc15; --accent-text: #111;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #fafaf7; --panel: #ffffff; --line: #e4e4e7; --text: #18181b; --muted: #52525b; --accent: #eab308; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: "M PLUS 1p", system-ui, sans-serif; line-height: 1.7;
  }
  main { max-width: 880px; margin: 0 auto; padding: 56px 16px 40px; }
  h1 {
    font-family: "Dela Gothic One", sans-serif; font-weight: 400;
    font-size: clamp(40px, 9vw, 72px); line-height: 1; margin: 0 0 12px; letter-spacing: .02em;
  }
  h1 span { color: var(--accent); }
  .lead { color: var(--muted); margin: 0 0 40px; }
  h2 { font-size: 14px; letter-spacing: .2em; color: var(--muted); margin: 0 0 16px; font-weight: 700; }
  ul.works { list-style: none; padding: 0; margin: 0; display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
  .works a {
    display: block; height: 100%; padding: 20px; border: 1px solid var(--line); border-radius: 14px;
    background: var(--panel); color: inherit; text-decoration: none; transition: border-color .15s, transform .15s;
  }
  .works a:hover, .works a:focus-visible { border-color: var(--accent); transform: translateY(-2px); outline: none; }
  .works .name { font-family: "Dela Gothic One", sans-serif; font-size: 22px; margin: 0 0 6px; }
  .works .desc { color: var(--muted); font-size: 14px; margin: 0 0 14px; }
  .tag {
    display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 10px; border-radius: 999px;
    background: var(--accent); color: var(--accent-text);
  }
  footer { max-width: 880px; margin: 0 auto; padding: 24px 16px 48px; color: var(--muted); font-size: 13px; border-top: 1px solid var(--line); }
  footer a { color: inherit; }
  @media (prefers-reduced-motion: reduce) { .works a { transition: none; } .works a:hover { transform: none; } }
</style>
</head>
<body>
<main>
  <h1>shin<span>poyo</span></h1>
  <p class="lead">つくったゲームやアプリの置き場です。</p>

  <h2>WORKS</h2>
  <ul class="works">
    <li><a href="/mashimashida/">
      <p class="name">マシマシ打</p>
      <p class="desc">山盛りラーメンの「コール」特化タイピングゲーム。店主の問いかけに即答せよ。</p>
      <span class="tag">タイピング・PC 向け</span>
    </a></li>
    <li><a href="/keshikasu/">
      <p class="name">けしカス</p>
      <p class="desc">消しゴムのカスを育てる放置クリッカーゲーム。</p>
      <span class="tag">クリッカー</span>
    </a></li>
    <li><a href="/mogumogu-camera/">
      <p class="name">もぐもぐカメラ</p>
      <p class="desc">カメラに映った口が動くと進む、食べる練習のおともアプリ。</p>
      <span class="tag">カメラ・子ども向け</span>
    </a></li>
  </ul>
</main>
<footer>
  <p>© 2026 shinpoyo. All rights reserved.　／　<a href="https://github.com/shinpoyo">GitHub</a>　／　<a href="/smudge-privacy/">SMUDGE プライバシーポリシー</a></p>
</footer>
</body>
</html>
